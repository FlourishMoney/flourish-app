<!doctype html>
<!--
  public/newsletter/index.html: the website's sign-up for "Canadian money dates this week" (CASL, 2026-11-04).
  newsletter.js asks /api/newsletter for the consent wording and draws it next to an unticked box. The form stays hidden until
  the server says the list is open, so this page says only "not open yet" before migration 0037 has run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canadian money dates this week | flourish</title>
<meta name="description" content="A weekly email of Canadian money dates from flourish. Double opt-in, with a one-click unsubscribe in every email.">
<link rel="canonical" href="https://flourishmoney.app/newsletter/">
<link rel="icon" href="/flourish-adult-favicon-32.png">
<script src="/newsletter/newsletter.js" defer></script>
<style>
  :root { --page: #F4F1EB; --card: #FFFFFF; --ink: #1A2035; --muted: #5B6170; --rule: #E6E1D8; --brand: #007048; --on-brand: #FFFFFF; --error: #B3261E; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #12151E; --card: #1A1F2B; --ink: #F4F1EB; --muted: #B4B9C6; --rule: #2A3142; --brand: #4FD1A0; --on-brand: #12151E; --error: #FFB4AB; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
  p { margin: 0 0 16px; line-height: 1.6; }
  label.field { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  input[type=email] { width: 100%; min-height: 44px; font: inherit; color: inherit; background: var(--page); border: 1px solid var(--muted); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
  label.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; margin-bottom: 16px; min-height: 44px; }
  label.consent input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--brand); }
  button { min-height: 44px; font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 22px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .err { color: var(--error); font-size: 14px; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Canadian money dates this week</h1>
  <p>A short weekly email of the Canadian money dates coming up.</p>
  <p id="closed">Sign-ups aren't open yet. Please check back soon.</p>
  <form id="form" hidden novalidate>
    <label class="field" for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label class="consent"><input id="consent" name="consent" type="checkbox"><span id="wording"></span></label>
    <p id="error" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Sign me up</button>
  </form>
  <p id="done" role="status" hidden>Check your email and confirm. Nothing is sent until you do.</p>
</main>
</body>
</html>
