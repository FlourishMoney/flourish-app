<!doctype html>
<!--
  public/get/index.html: THE DEVICE LINK, flourishmoney.app/get?ref=founding (2026-10-27).
  get.js sends an iPhone or iPad to the App Store and an Android phone to Google Play. Anything else stays on this
  page: the stores' own badges (one of each; Apple allows one App Store badge per layout), and the website's founding
  checkout as a smaller second way. Plausible counts which way people went, with no personal data (get.js).
  A plain static page, not the app: it loads in a moment, and works with scripts off (the badges and the link are
