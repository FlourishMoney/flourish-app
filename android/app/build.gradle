apply plugin: 'com.android.application'

// True only when every one of the four upload-signing properties is present. Checked as a set:
// three out of four is a misconfiguration, not a signing config, and would fail deep in the build
// with a message about the missing one rather than the missing set.
ext.hasUploadSigning = ['FLOURISH_UPLOAD_STORE_FILE', 'FLOURISH_UPLOAD_KEY_ALIAS',
                        'FLOURISH_UPLOAD_STORE_PASSWORD', 'FLOURISH_UPLOAD_KEY_PASSWORD']
                       .every { project.hasProperty(it) }

android {
    namespace = "com.flourishmoney.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.flourishmoney.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ── Release signing ──────────────────────────────────────────────────────────────────────
    // The four properties live in ~/.gradle/gradle.properties, OUTSIDE this repository, and the
    // keystore file itself is never copied in — only its path is referenced. Nothing here prints
    // or logs a password: Gradle reads the properties directly.
    //
    // When the properties are absent — CI, a fresh clone, anyone who is not the founder — the
    // release build still CONFIGURES and simply produces an unsigned bundle. A missing local
    // credential must not break the build for everybody else, and a hard failure here would.
    signingConfigs {
        release {
            if (project.hasUploadSigning) {
                storeFile file(project.property('FLOURISH_UPLOAD_STORE_FILE'))
                keyAlias project.property('FLOURISH_UPLOAD_KEY_ALIAS')
                storePassword project.property('FLOURISH_UPLOAD_STORE_PASSWORD')
                keyPassword project.property('FLOURISH_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed when the upload key is available, unsigned when it is not — never half-set.
            signingConfig project.hasUploadSigning ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
