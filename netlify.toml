[build]
  command   = "npm run build"
  publish   = "dist"

# Production only: no "[WORDS: id]" placeholder ships (scripts/check-pending-words.mjs). Deploy previews build
# with the plain command above, so screens with words still to come can be looked at.
[context.production]
  command   = "npm run build && node scripts/check-pending-words.mjs dist netlify/functions"

[build.environment]
  NODE_VERSION           = "22"
  SECRETS_SCAN_OMIT_KEYS = "PLAID_ENV"

# Scheduled: the waitlist welcome sweep. Every 15 minutes it emails any waitlist row whose
# welcomed_at is still null and that is at least 5 minutes old, then stamps welcomed_at. The request
# path (join_waitlist) stays best effort; this is what guarantees the email is sent exactly once.
# Netlify kills a scheduled function at 30 seconds, and the function stops starting new sends at 20.
[functions."waitlist-sweep"]
  schedule = "*/15 * * * *"

# Scheduled: the founding link email (payments open 2026-10-26). Every 15 minutes it sends each founding
# household its link, once, and records the send on the row. It reads, sends and writes NOTHING unless
# BILLING_ENABLED and FOUNDING_LINK_EMAIL are both exactly "true" (docs/ops/BILLING-DAY-OCT-26.md).
[functions."founding-link-sweep"]
  schedule = "*/15 * * * *"

# Scheduled: the rate limiters' cleanup (netlify/functions/_lib/limiterCleanup.js). Once a day it deletes every
# limiter entry whose window has passed, and any key still in the old format that held a raw IP or email address.
[functions."limiter-cleanup"]
  schedule = "@daily"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' cdn.plaid.com *.plaid.com https://plausible.io; connect-src 'self' https://plausible.io api.anthropic.com cdn.plaid.com production.plaid.com sandbox.plaid.com *.plaid.com qhcccjkmvijrybagkvyw.supabase.co *.ingest.sentry.io *.sentry.io; style-src 'self' 'unsafe-inline' *.plaid.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: *.plaid.com; frame-src *.plaid.com cdn.plaid.com; worker-src 'self' blob:;"

# The self-unregistering kill-switch SW (public/sw.js) must NEVER be cached, so a returning visitor's
# browser re-fetches it on its next service-worker update check and retires the old (pre-Vite) zombie
# worker. A real file at /sw.js is served directly and takes precedence over the SPA fallback below.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Redirect: app calls /api/coach → Netlify function
[[redirects]]
  from   = "/api/coach"
  to     = "/.netlify/functions/coach"
  status = 200

# Redirect: app calls /api/plaid → Netlify function
[[redirects]]
  from   = "/api/plaid"
  to     = "/.netlify/functions/plaid"
  status = 200

# Redirect: app calls /api/beta → Netlify function
[[redirects]]
  from   = "/api/beta"
  to     = "/.netlify/functions/beta"
  status = 200

# Redirect: the signed one-click unsubscribe link in every waitlist email → Netlify function.
# GET shows a one-button page; POST (the button, or a mailbox's RFC 8058 one-click) unsubscribes.
[[redirects]]
  from   = "/api/unsubscribe"
  to     = "/.netlify/functions/unsubscribe"
  status = 200

# Redirect: app calls /api/billing → Netlify function.
# The function itself answers 404 to everything while BILLING_ENABLED is unset, so this route
# existing does not make billing reachable — see netlify/functions/billing.js.
[[redirects]]
  from   = "/api/billing"
  to     = "/.netlify/functions/billing"
  status = 200

# Redirect: the link in "Confirm your email address for your founding price" → Netlify function.
# GET shows one button and changes nothing; POST confirms (netlify/functions/founding-confirm.js).
[[redirects]]
  from   = "/api/founding-confirm"
  to     = "/.netlify/functions/founding-confirm"
  status = 200

# Redirect: the landing page's founding offer reads /api/founding → Netlify function.
# GET only; answers a count of spots left and nothing else (netlify/functions/founding.js).
[[redirects]]
  from   = "/api/founding"
  to     = "/.netlify/functions/founding"
  status = 200

# Redirect: the app's once-per-account activation signals → Netlify function. POST only, signed in;
# adds 1 to an aggregate per-day counter and keeps nothing else (netlify/functions/activation.js).
[[redirects]]
  from   = "/api/activation"
  to     = "/.netlify/functions/activation"
  status = 200

# Redirect: Settings > Household (couple mode) → Netlify function. POST only, signed in. Answers 404 to
# everything until HOUSEHOLD_ENABLED is "true" (netlify/functions/household.js).
[[redirects]]
  from   = "/api/household"
  to     = "/.netlify/functions/household"
  status = 200

# SPA fallback — all routes → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
