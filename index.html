<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no locks pinch-zoom in the Capacitor WKWebView (a zoomed-in
         native app can't zoom back out). viewport-fit=cover is KEPT — the iOS header padding uses
         env(safe-area-inset-*), which collapses to 0 without it. Note iOS *Safari* ignores
         user-scalable=no on the open web (Apple re-enabled zoom for accessibility), so this locks the
         native wrapper without removing zoom for web users. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2E8B2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Flourish: Financial Coaching</title>
    <link rel="icon" type="image/png" href="/flourish-adult-favicon-32.png" id="favicon" />
    <link rel="apple-touch-icon" href="/flourish-adult-app-icon-180.png" id="apple-touch-icon" />
    <!-- Sprint Z #16: the kids favicon/title swap moved into src/main.jsx so the CSP can drop 'unsafe-inline'. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded here, not from an @import inside the app shell's <style>: the shell mounts behind the
         auth/onboarding early returns, so pre-auth screens (landing, auth, reset, MFA) had no webfont
         and silently fell back to Times. Plus Jakarta Sans stops at 800 — nothing may ask for 900. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
    <!-- The browser's default 8px body margin inset every screen by 8px on each edge. On the app shell
         it showed as dark gutters (globalStyles paints body #060A0E); on the pre-auth screens (landing,
         login, reset, MFA), which mount before globalStyles and leave body transparent, it showed as a
         white border, and it added 16px to every page's height. Reset here, not in globalStyles, so
         it applies to every screen, the native build included (it bundles this file). -->
    <style>body{margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
