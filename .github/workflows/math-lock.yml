name: MATH-LOCK

# The math test gate. Runs on every push and PR to main and publishes the "math" status check that
# branch protection requires; a red check here MUST block merge to main (see DEPLOY.md).
#
# npm ci IS required. The original suites imported only src/lib/*.js with zero runtime deps, so the
# first version of this workflow skipped installing. That is no longer true: the gate now includes
# forecastNaN, whose forecast path transitively imports @capacitor/local-notifications
# (notificationPlanner -> notifications). Without node_modules the run dies with ERR_MODULE_NOT_FOUND
# before that suite executes — an ~11s death that looks nothing like a test failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job name is the status-check context branch protection matches — keep it "math".
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # test:math now ends with tests/layout.browser.test.cjs, which builds the app and drives
      # Chromium over the demo at four widths and two text sizes (docs/design/LAYOUT-RULES.md). The
      # browser binary is not part of npm ci, so it is installed here; without this step the suite
      # fails with "chromium launches" rather than a layout finding.
      - name: Install Chromium for the layout suite
        run: npx playwright install --with-deps chromium
      - name: Run MATH-LOCK suites
        run: npm run test:math
        env:
          # Placeholder Supabase values: the layout suite builds the app and drives the demo, which
          # never authenticates, but the Supabase client throws at import without them.
          VITE_SUPABASE_URL: https://placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
